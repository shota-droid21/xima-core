user xima xima;

# When running nginx as non-root (uid=1000), the default pid path under /run may be unwritable.
pid /tmp/nginx.pid;

worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Avoid permission issues when running workers as uid=1000.
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # Subrequest logging can become a bottleneck under high concurrency.
    log_subrequest off;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Reduce file metadata I/O for hot static/thumb reads.
    open_file_cache max=10000 inactive=30s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # Micro-cache for auth subrequests (keyed by Authorization + original URI).
    proxy_cache_path /var/cache/nginx/auth levels=1:2 keys_zone=auth_cache:10m inactive=1m max_size=100m use_temp_path=off;

    # FastAPI upstream
    upstream xima_api {
        server host.docker.internal:27800;

        # Keep upstream connections warm; auth_request can otherwise create many short-lived connections.
        keepalive 64;
    }

    # Map to determine if authentication should be skipped
    # OPTIONS requests and /health should skip auth
    map $request_method$request_uri $skip_auth {
        "~^OPTIONS" "1"; # All OPTIONS requests
        "~GET/health" "1"; # GET /health
        default "0";
    }

    server {
        listen 8080;
        # workspace restore uploads can be large (tar.zst archives).
        # Keep a generous default headroom for UI/API backup restore.
        client_max_body_size 2g;

        # Pairing prove endpoint must be callable without JWT.
        # SaaS will use the returned signed proof to register the agent and then issue API JWTs.
        location = /auth/pair/prove {
            # Handle CORS for OPTIONS requests
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'POST, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
                add_header 'Access-Control-Max-Age' 1728000 always;
                add_header 'Content-Type' 'text/plain; charset=utf-8' always;
                add_header 'Content-Length' 0 always;
                return 204;
            }

            # Only allow POST/OPTIONS.
            if ($request_method !~ ^(POST|OPTIONS)$) {
                return 405;
            }

            # Let FastAPI handle CORS headers for actual responses.

            proxy_pass http://xima_api;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            client_max_body_size 10m;
        }

        # --- 認証リクエスト用の内部エンドポイント
        location = /_auth_request {
            internal;

            access_log off;

            # Pass original method as query parameter
            proxy_pass http://xima_api/_auth?method=$original_method;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";

            # Upstream keepalive
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Fail fast; auth is a small request.
            proxy_connect_timeout 2s;
            proxy_send_timeout 2s;
            proxy_read_timeout 2s;

            # クライアントの Authorization を FastAPI に渡す
            proxy_set_header Authorization $http_authorization;

            # あった方がデバッグしやすい
            proxy_set_header X-Original-URI $auth_request_uri;

            # Micro-cache to absorb bursts of authenticated static/thumb requests.
            proxy_cache auth_cache;
            proxy_cache_key "$http_authorization|$auth_request_uri";
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;
            proxy_cache_valid 200 2s;
            proxy_cache_valid 401 1s;
            proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
            add_header X-Auth-Cache $upstream_cache_status always;
        }

        location /thumbs/ {
            # Pass original request method to auth endpoint
            set $original_method $request_method;
            set $auth_request_uri $request_uri;

            # Handle CORS for OPTIONS requests
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
                add_header 'Access-Control-Max-Age' 1728000 always;
                add_header 'Content-Type' 'text/plain; charset=utf-8' always;
                add_header 'Content-Length' 0 always;
                return 204;
            }

            # Only allow methods needed for static delivery.
            if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
                return 405;
            }

            # Authentication required for actual requests
            auth_request /_auth_request;
            auth_request_set $auth_status $upstream_status;

            # CORS headers for actual responses
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

            alias /data/workspaces/;
            access_log off;
            add_header Cache-Control "private, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # --- (C) Static direct serving (FastAPI bypass)
        # /static/<path-under-workspaces-root> -> /data/workspaces/<path-under-workspaces-root>
        # Example (thumb cache):
        #   /static/<ws>/experiments/<exp>/cache/thumbs/w256/xx/<sha>.webp
        location /static/ {
            # Pass original request method to auth endpoint
            set $original_method $request_method;
            set $auth_request_uri $request_uri;

            # Handle CORS for OPTIONS requests
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
                add_header 'Access-Control-Max-Age' 1728000 always;
                add_header 'Content-Type' 'text/plain; charset=utf-8' always;
                add_header 'Content-Length' 0 always;
                return 204;
            }

            # Only allow methods needed for static delivery.
            if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
                return 405;
            }

            # Authentication required for actual requests
            auth_request /_auth_request;
            auth_request_set $auth_status $upstream_status;

            # CORS headers for actual responses
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

            alias /data/workspaces/;
            access_log off;
            add_header Cache-Control "private, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # /health endpoint - no auth required (must come before location /)
        location = /health {
            # Let FastAPI handle CORS headers
            proxy_pass http://xima_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- All other API requests
        location / {
            # Pass original request method to auth endpoint
            set $original_method $request_method;
            set $auth_request_uri $request_uri;

            # Authentication via FastAPI auth endpoint
            # Note: FastAPI /_auth handles OPTIONS requests without requiring tokens
            auth_request /_auth_request;
            auth_request_set $auth_status $upstream_status;

            # If auth_request rejects (401/403), nginx generates the response and FastAPI CORS middleware
            # is bypassed. Catch those and add CORS headers so browsers can see the real status.
            error_page 401 = @cors401;
            error_page 403 = @cors403;

            proxy_pass http://xima_api;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 大きめのレスポンス（labels.jsonなど）もあるので一応
            client_max_body_size 100m;
        }

        # CORS-enabled error responses for auth_request failures (Option B: include headers/methods).
        location @cors401 {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,Accept,Origin' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
            return 401;
        }

        location @cors403 {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,Accept,Origin' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
            return 403;
        }

        # Error handlers - let FastAPI handle CORS for errors too
        # Removed custom error handlers as they cause CORS header duplication
    }
}
